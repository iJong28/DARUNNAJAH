<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Pondok Pesantren Darunnajah Timampu</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body
    class="min-h-screen bg-linear-to-br from-[#f4f8f2] via-[#e7f1e9] to-[#fff8d8] font-sans text-slate-900 antialiased"
  >
    <main
      class="mx-auto flex min-h-screen w-full max-w-6xl flex-col px-4 py-6 sm:px-6 sm:py-10"
    >
      <header data-navbar></header>

      <section class="mb-8 max-w-3xl sm:mb-10 pt-32">
        <p
          class="mb-3 text-sm font-semibold uppercase tracking-[0.2em] text-[#00895f]"
        >
          Portal Darunnajah
        </p>
        <h1
          class="text-3xl font-extrabold leading-tight text-[#0b3b01] sm:text-5xl"
        >
          Selamat datang, <span id="dashboard-name">Pengguna</span>.
        </h1>
        <p
          id="dashboard-role"
          class="mt-3 text-base font-semibold text-slate-600"
        ></p>
      </section>

      <div
        id="dashboard-error"
        class="mb-6 hidden border-l-4 border-[#b42318] bg-[#fff1f0] px-4 py-3 text-sm leading-6 text-[#912018]"
        role="alert"
        aria-live="polite"
      ></div>

      <section class="mb-auto">
        <div
          id="dashboard-menu"
          class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3"
          aria-live="polite"
        ></div>
        <div id="dashboard-role-content" class="mt-8 grid gap-5 sm:grid-cols-2 lg:grid-cols-3" aria-live="polite">
          <!-- Role-specific widgets will be rendered here by dashboard.js -->
        </div>
      </section>

      <footer class="mt-auto pt-12 text-xs text-slate-500">
        <a
          href="index.html"
          class="font-semibold transition hover:text-[#00895f]"
          >&larr; Kembali ke Beranda</a
        >
      </footer>
    </main>
    <script type="module" src="js/dashboard.js"></script>
  </body>
</html>
