<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Pondok Pesantren Darunnajah Timampu</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body
    class="min-h-screen bg-slate-100 font-sans text-slate-900 antialiased flex flex-col md:flex-row overflow-x-hidden"
  >
    <!-- BACKDROP MOBILE DRAWER -->
    <div
      id="sidebar-backdrop"
      class="fixed inset-0 z-40 bg-black/60 backdrop-blur-xs hidden md:hidden transition-opacity"
    ></div>

    <!-- ======================================================== -->
    <!-- 1. FULL-HEIGHT LEFT SIDEBAR NAVIGATION                  -->
    <!-- ======================================================== -->
    <aside
      id="app-sidebar"
      class="fixed inset-y-0 left-0 z-50 flex w-72 flex-col justify-between bg-gradient-to-b from-[#062402] via-[#093502] to-[#041a01] text-white shadow-2xl transition-transform duration-300 ease-in-out -translate-x-full md:translate-x-0 md:static md:z-30 shrink-0"
      aria-label="Sidebar Menu Utama"
    >
      <!-- TOP BRANDING & USER PROFILE -->
      <div class="p-5 border-b border-emerald-900/50">
        <div class="flex items-center justify-between">
          <a href="index.html" class="flex items-center block focus:outline-none transition hover:opacity-90" title="Kembali ke Beranda">
            <img
              src="aset/logo/logonavbar1.png"
              alt="Pondok Pesantren Darunnajah Timampu"
              class="h-11 w-auto max-w-[210px] object-contain drop-shadow-xs"
            />
          </a>
          <!-- Close button mobile -->
          <button
            id="btn-close-sidebar-mobile"
            type="button"
            class="md:hidden text-slate-400 hover:text-white p-1 rounded-lg cursor-pointer"
            aria-label="Tutup Menu"
          >
          </button>
        </div>

        <!-- User Profile Card in Sidebar -->
        <div
          class="mt-5 flex items-center gap-3 p-3 rounded-2xl bg-white/10 backdrop-blur-sm border border-white/10"
        >
          <div
            id="sidebar-user-avatar"
            class="h-9 w-9 rounded-xl bg-emerald-500 text-white font-black flex items-center justify-center text-sm shadow-xs"
          >
            D
          </div>
          <div class="min-w-0 flex-1">
            <p
              id="sidebar-user-name"
              class="text-xs font-black text-white truncate"
            >
              Memuat...
            </p>
            <span
              id="sidebar-user-role-badge"
              class="inline-block px-2 py-0.2 rounded-full text-[9px] font-bold bg-emerald-400/20 text-emerald-300 border border-emerald-400/30"
            >
              Pengguna
            </span>
          </div>
        </div>
      </div>

      <!-- NAVIGATION MENU ITEMS -->
      <div class="flex-1 overflow-y-auto px-3.5 py-4 space-y-6 no-scrollbar">
        <div>
          <p
            class="px-3 text-[10px] font-extrabold uppercase tracking-widest text-emerald-300/50 mb-2"
          >
            Menu Halaman
          </p>
          <nav id="sidebar-nav-menu" class="space-y-1">
            <!-- Di-render dinamis oleh dashboard.js -->
          </nav>
        </div>

        <div>
          <p
            class="px-3 text-[10px] font-extrabold uppercase tracking-widest text-emerald-300/50 mb-2"
          >
            Pusat Pengaturan
          </p>
          <div class="space-y-1">
            <button
              id="btn-sidebar-profile"
              type="button"
              class="sidebar-nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-emerald-100/90 hover:bg-white/10 transition text-left cursor-pointer"
              data-page="profile"
            >
              <span class="text-base">👤</span>
              <span>Profil & Sandi Saya</span>
            </button>
          </div>
        </div>
      </div>

      <!-- BOTTOM ACTIONS -->
      <div class="p-4 border-t border-emerald-900/50 bg-[#031500]/60 space-y-1.5">
        <a
          href="index.html"
          class="flex items-center gap-2.5 px-3 py-2 text-xs font-semibold text-emerald-200/70 hover:text-white transition rounded-xl hover:bg-white/5"
        >
          <span>🌐</span> Halaman Beranda Publik
        </a>
        <button
          id="btn-sidebar-logout"
          type="button"
          class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-bold text-red-300 hover:bg-red-500/20 hover:text-red-100 transition cursor-pointer text-left"
        >
          <span>🚪</span> Keluar (Logout)
        </button>
      </div>
    </aside>

    <!-- ======================================================== -->
    <!-- 2. MAIN CONTENT AREA (KONTEN HALAMAN TERPISAH)            -->
    <!-- ======================================================== -->
    <div class="flex-1 flex flex-col min-w-0 min-h-screen bg-slate-100/70">
      <!-- TOP HEADER BAR -->
      <header
        class="sticky top-0 z-20 flex h-16 items-center justify-between border-b border-slate-200 bg-white/90 px-4 sm:px-8 backdrop-blur-md"
      >
        <div class="flex items-center gap-3">
          <!-- Mobile toggle button -->
          <button
            id="btn-toggle-sidebar-mobile"
            type="button"
            class="md:hidden p-2 rounded-xl text-slate-700 hover:bg-slate-100 cursor-pointer"
            aria-label="Buka Menu"
          >
            <svg
              class="h-6 w-6"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"
              />
            </svg>
          </button>
          <div>
            <h1
              id="topbar-page-title"
              class="text-base sm:text-lg font-black text-slate-900 leading-tight"
            >
              Ringkasan Utama
            </h1>
            <p
              id="topbar-page-subtitle"
              class="text-[11px] text-slate-500 hidden sm:block"
            >
              Portal Pondok Pesantren Darunnajah Timampu
            </p>
          </div>
        </div>

        <!-- Right Quick Action -->
        <div class="flex items-center gap-2">
          <button
            id="topbar-btn-profile"
            type="button"
            class="inline-flex items-center gap-2 rounded-xl border border-slate-200 bg-slate-50 hover:bg-emerald-50 px-3.5 py-2 text-xs font-bold text-slate-700 transition cursor-pointer"
          >
            <span>👤</span>
            <span class="hidden sm:inline" id="topbar-profile-name">Profil Saya</span>
          </button>
        </div>
      </header>

      <!-- MAIN PAGE CONTENT (EXCLUSIVE VIEW) -->
      <main class="flex-1 p-4 sm:p-8 overflow-y-auto">
        <!-- Error alert -->
        <div
          id="dashboard-error"
          class="mb-6 hidden border-l-4 border-[#b42318] bg-[#fff1f0] px-4 py-3 text-sm leading-6 text-[#912018] rounded-r-xl"
          role="alert"
          aria-live="polite"
        ></div>

        <!-- MAIN PAGE CONTAINER: Tempat Tiap Menu Dirender Terpisah -->
        <div id="main-page-container" class="space-y-6">
          <div class="p-8 text-center text-slate-400">
            <span class="inline-block animate-spin text-2xl mb-2">⏳</span>
            <p class="text-xs">Memuat halaman dashboard...</p>
          </div>
        </div>
      </main>
    </div>

    <!-- Modal Interaktif Dashboard -->
    <div
      id="dashboard-modal-backdrop"
      class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 p-4 backdrop-blur-xs transition-opacity"
      aria-modal="true"
      role="dialog"
    >
      <div
        id="dashboard-modal-card"
        class="relative w-full max-w-xl overflow-hidden rounded-2xl bg-white shadow-2xl transition-all"
      >
        <div
          class="flex items-center justify-between border-b border-slate-100 bg-[#f8faf7] px-6 py-4"
        >
          <h3 id="dashboard-modal-title" class="text-base font-bold text-[#0b3b01]">
            Judul Modal
          </h3>
          <button
            id="dashboard-modal-close"
            type="button"
            class="rounded-lg p-1 text-slate-400 hover:bg-slate-100 hover:text-slate-700 transition cursor-pointer"
            aria-label="Tutup"
          >
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>
        <div id="dashboard-modal-body" class="max-h-[75vh] overflow-y-auto px-6 py-5 text-sm">
          <!-- Dynamic Modal Content -->
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div
      id="dashboard-toast"
      class="fixed bottom-6 right-6 z-50 hidden max-w-sm transform items-center gap-3 rounded-xl bg-slate-900 px-4 py-3 text-sm text-white shadow-2xl transition"
      role="status"
    >
      <span id="dashboard-toast-message">Notifikasi</span>
    </div>

    <script type="module" src="js/dashboard.js"></script>
  </body>
</html>
